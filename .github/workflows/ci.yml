name: CI

# Manual only. Automatic builds happen in release.yml, after a development -> release PR is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ExileLens.slnx
      - name: Build
        run: dotnet build ExileLens.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/ExileLens.Tests/ExileLens.Tests.csproj --configuration Release --no-build
